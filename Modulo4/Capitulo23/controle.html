<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novos controles e atributos</title>
</head>
<body>
    <h1>Teste Formulário</h1>
    
    <form action="cadastro.php">
        <p>
            <label for="nome">Nome</label>
            <input type="text" name="nome" id="nome" required maxlength="30" placeholder="Nome completo" autocomplete="name">
        </p>

        <p>
            <label for="media">Média</label>
            <input type="number" name="media" id="media" min="0" max="10" placeholder="0 a 10" step="0.5">
        </p>

        <p>
            <label for="mes">Périodo letivo</label>
            <input type="month" name="mes" id="mes">
        </p>

        <p>
            <label for="data">Dia da Prova</label>
            <input type="date" name="dia" id="dia">
        </p>

        <p>
            <label for="hora">Que horas são</label>
            <input type="time" name="hora" id="hora">
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
