<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>

    <style>
        div.container {
            background-color: antiquewhite;

            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            background-color: violet;
            border: 1px solid black;
            text-align: center;
            flex-basis: auto;
        }

    </style>

</head>
<body>
    <div class="container">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">Está se adaptandoB</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">Ao tamanho Da Div</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">Pequeno</div>
    </div>
</body>
</html>
