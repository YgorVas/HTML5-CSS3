<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colgroup</title>

    <style>
        table {
            width: 400px;
        }

        td, th {
            border: 1px solid black;
            padding: 10px;
        }

        col.cnome {
            background-color: aquamarine;
        }

    </style>

</head>
<body>
    <h1>Agrupar Colunas</h1>

    <table>
        <colgroup>
            <col class="cnome">
            <col class="csexo">
            <col class="cidade">
            <col class="cprofi">
        </colgroup>

        <caption>Cadastro</caption>

        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>

        <tr>
            <td>Ana</td>
            <td>F</td>
            <td>32</td>
            <td>Garimpeira</td>
        </tr>
    
        <tr>
            <td>Maria</td>
            <td>F</td>
            <td>20</td>
            <td>Estagiária</td>
        </tr>

        <tr>
            <td>Carlos</td>
            <td>M</td>
            <td>29</td>
            <td>Professor</td>
        </tr>

        <tr>
            <td>Laura</td>
            <td>F</td>
            <td>25</td>
            <td>Enfermeira</td>
        </tr>

    </table>

</body>
</html>
