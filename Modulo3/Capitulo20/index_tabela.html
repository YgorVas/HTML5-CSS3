<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>

    <style>

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table { 
            width: 400px;
            height: 100px;
            border-collapse: collapse;
        }
        
        td {
            border: 2px solid black;
            padding: 8px;
            text-align: left; /*alinhamento horizontal left center right*/
            vertical-align: top; /*alinhamento vertical top middle bottom*/
        }

        .numero {
            text-align: right;
        }
    </style>

</head>
<body>
    <h1>Minha primeira tabela</h1>

    <table>
        <tr>
            <td>A1</td> <!--Primeira linha-->
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr>
            <td>A2</td> <!--Segunda linha-->
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr>
            <td>A3</td> <!--terceira linha-->
            <td>B3</td>
            <td class="numero">20</td>
        </tr>
    </table>

</body>
</html>
