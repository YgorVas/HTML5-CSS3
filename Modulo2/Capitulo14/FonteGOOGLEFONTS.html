<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes com google fonts</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap');

        @import url('https://fonts.googleapis.com/css2?family=Glass+Antiqua&display=swap');
        body {
            font: normal normal 1em 'Nanum Gothic', Arial, sans-serif; 
            color: black;
        }
        h1 {
            font-family: 'Glass Antiqua', cursive, serif;
        }

    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Para adicionar uma fonte externa ao seu site através do google fonts, você busca a fonte no site e usa o @import url no cabeçalho para que possa ser colocada no font family, o @import url tem que ser fora de qualquer aninhamento precisa estar isolado no style.</p>
</body>
</html>
