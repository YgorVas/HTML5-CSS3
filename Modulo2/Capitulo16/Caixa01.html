<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelos de Caixas</title>
    
    <style>

        h1 {
            background-color: antiquewhite;

            width: 300px;
            height: 300px;

            border-width: 10px;
            border-style: dotted;
            border-color: bisque;
            
            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
            
            margin-top: 10px;
            margin-right: 10px;
            margin-bottom: 10px;
            margin-left: 10px;

        }

        a {
            border-width: 2px;
            border-style: dashed;
            border-color: cadetblue;
        }

    </style>

</head>
<body>
    <h1>Exemplos de Caixa Box-Level</h1>
    <p>Parágrafos são exemplos de Box-Level, <a href="#">mas os links são exemplos de inline-level.</a> Vamos ver como funciona.</p>
</body>
</html>
